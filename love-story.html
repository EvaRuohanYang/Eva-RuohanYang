<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4b516a">
  <title>筷影与指间 · 双男主奇幻爱情故事</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #283747;
      --muted: #73808a;
      --paper: #f1eee8;
      --panel: #fffdf9;
      --gold: #d3a65e;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); display: grid; place-items: center; padding: 34px 20px; }
    .page { width: min(1160px, 100%); }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin: 0 3px 16px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .14em; }
    .story-tag { display: inline-flex; align-items: center; gap: 8px; }
    .story-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px #d3a65e22; }
    .panel { overflow: hidden; background: var(--panel); border: 1px solid #e6e0d6; border-radius: 24px; box-shadow: 0 26px 76px #34374c12, 0 3px 10px #34374c08; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: 26px 34px 20px; }
    .eyebrow { margin: 0 0 7px; color: #987646; font-size: 11px; font-weight: 850; letter-spacing: .12em; }
    h1 { margin: 0; font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; font-size: clamp(30px, 4vw, 45px); font-weight: 500; letter-spacing: -.035em; line-height: 1.12; }
    .intro-note { max-width: 380px; margin: 0 0 3px; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .scene { position: relative; margin: 0 18px; overflow: hidden; border-radius: 18px; background: #555b72; }
    video { display: block; width: 100%; height: auto; background: #555b72; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .controls { display: flex; align-items: center; gap: 12px; padding: 17px 28px 20px; }
    button, .download { min-width: 108px; height: 42px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; color: white; background: var(--ink); font: inherit; font-size: 13px; font-weight: 750; cursor: pointer; text-decoration: none; transition: transform .16s ease, background .16s ease; }
    button:hover, .download:hover { transform: translateY(-1px); background: #3b5363; }
    button:focus-visible, .download:focus-visible { outline: 3px solid #c7a772; outline-offset: 3px; }
    .restart { min-width: 42px; width: 42px; color: var(--ink); background: #f0ede5; font-size: 17px; }
    .restart:hover { background: #e6dfd2; }
    .download { min-width: 112px; color: #6f6048; background: #f2eadb; }
    .download:hover { color: var(--ink); background: #e9ddc7; }
    .text-only { color: var(--muted); font-size: 12px; }
    .counter { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .timeline { height: 3px; background: #efece5; }
    .progress { width: 0; height: 100%; background: var(--gold); transition: width .08s linear; }
    .caption { display: flex; justify-content: space-between; gap: 15px; margin: 13px 4px 0; color: #788179; font-size: 11px; }
    @media (max-width: 720px) {
      body { padding: 18px 10px; }
      .intro { display: block; padding: 21px 20px 15px; }
      .intro-note { margin-top: 9px; }
      .scene { margin: 0 8px; }
      .controls { flex-wrap: wrap; padding: 13px 14px 16px; gap: 9px; }
      .text-only { order: 2; width: 100%; font-size: 10px; }
      .counter { margin-left: auto; }
      .caption { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <span>奇幻爱情故事 · 01</span>
      <span class="story-tag"><span class="story-dot" aria-hidden="true"></span><span>双男主</span></span>
    </div>
    <section class="panel" aria-label="筷影与指间的故事">
      <header class="intro">
        <div>
          <p class="eyebrow">一双筷子，一次指尖轻点</p>
          <h1>筷影与指间</h1>
        </div>
        <p class="intro-note">一个握住筷子就能变身，一个轻轻一指就能让心念之物登场。今晚，他们一起守护灯火，也慢慢走进彼此心里。</p>
      </header>
      <div class="scene">
        <video id="filmVideo" controls playsinline preload="metadata" poster="assets/love-story-poster.jpg" aria-label="筷影与指间动画视频"></video>
        <div class="sr-only" aria-live="polite" aria-atomic="true"><span id="speakerText">筷影</span>：<span id="dialogueText">我最喜欢筷子。只要双筷在手，我就能变身成守护夜市的侠客。</span></div>
      </div>
      <div class="controls">
        <button id="playButton" type="button" aria-pressed="false">▶　播放</button>
        <button id="replayButton" class="restart" type="button" aria-label="重新播放" title="重新播放">↺</button>
        <a id="downloadVideo" class="download" href="assets/love-story.mp4" download>下载 MP4</a>
        <span class="text-only">简体中文对白以字幕显示，无语音</span>
        <span id="counter" class="counter">01 / 08</span>
      </div>
      <div class="timeline" aria-hidden="true"><div id="progress" class="progress"></div></div>
    </section>
    <div class="caption"><span>照片头像 · 手绘火柴人 · 灯火古镇</span><span>对白与口型按时间同步</span></div>
  </main>

  <script id="film-data" type="application/json">
  {
    "title": "筷影与指间",
    "scene": "lantern-town",
    "duration": 32,
    "lineDuration": 4,
    "fps": 24,
    "video": "assets/love-story.mp4",
    "poster": "assets/love-story-poster.jpg",
    "heads": ["assets/head-young-man.png", "assets/head-glasses.png"],
    "characters": ["筷影", "指间"],
    "dialogue": [
      {"who":"筷影","mark":"筷","text":"我最喜欢筷子。只要双筷在手，我就能变身成守护夜市的侠客。","magic":"chopsticks"},
      {"who":"指间","mark":"指","text":"我最喜欢小手一指。想让什么登场，它就会亮闪闪地出现。","action":"point"},
      {"who":"筷影","mark":"筷","text":"那晚，风把一盏灯笼吹上了屋檐。我握紧竹筷，金光一闪，变身追上夜风。","magic":"transform"},
      {"who":"指间","mark":"指","text":"我朝天空轻轻一指，灯笼便从云后登场，稳稳落进你的手里。","action":"point"},
      {"who":"筷影","mark":"筷","text":"你明明能让很多东西登场，怎么偏偏把我叫到你身边？"},
      {"who":"指间","mark":"指","text":"因为我最想见的人一直是你。每次一指，你都会登场。","action":"point"},
      {"who":"筷影","mark":"筷","text":"那我把一支筷子交给你。下次变身，我们就并肩守护这条街。","magic":"chopsticks"},
      {"who":"指间","mark":"指","text":"好啊。你变身守护夜色，我负责让星星登场。然后，我们一直一起走下去。","action":"point"}
    ]
  }
  </script>

  <canvas id="renderSource" width="1100" height="560" hidden></canvas>
  <script src="world.js"></script>
  <script src="film-player.js"></script>
  <script>
    const FILM = JSON.parse(document.getElementById('film-data').textContent);
    const LENGTH = FILM.duration;
    const sourceCanvas = document.getElementById('renderSource');
    const sourceContext = sourceCanvas.getContext('2d');
    const heads = [new Image(), new Image()];
    heads[0].src = FILM.heads[0];
    heads[1].src = FILM.heads[1];

    function mouthAt(line, elapsed) {
      const syllables = Array.from(line.text.replace(/[，。！？、；：‘’“”\s]/g, ''));
      if (!syllables.length || elapsed < .20 || elapsed > FILM.lineDuration - .24) return 0;
      const position = (elapsed - .20) / (FILM.lineDuration - .55) * syllables.length;
      const phase = position - Math.floor(position);
      return Math.max(0, Math.sin(Math.PI * phase));
    }

    function draw(t) {
      const sceneTime = t % LENGTH;
      const index = Math.min(Math.floor(sceneTime / FILM.lineDuration), FILM.dialogue.length - 1);
      const line = FILM.dialogue[index];
      const lineElapsed = sceneTime - index * FILM.lineDuration;
      CartoonWorld.drawRomanceScene(sourceContext, sceneTime, { reveal: line.action === 'point' });
      const drift = Math.sin(sceneTime * .28) * 28;
      const firstSpeaking = line.who === FILM.characters[0];
      const secondSpeaking = line.who === FILM.characters[1];
      CartoonWorld.drawStickFigure(sourceContext, {
        x: 450 + drift, floor: 486, time: sceneTime, phase: 0,
        head: heads[0], action: 'walk', magic: firstSpeaking ? line.magic : '',
        mouthOpen: firstSpeaking ? mouthAt(line, lineElapsed) : 0
      });
      CartoonWorld.drawStickFigure(sourceContext, {
        x: 674 + drift, floor: 486, time: sceneTime, phase: 1.7,
        head: heads[1], action: secondSpeaking ? 'point' : 'walk',
        mouthOpen: secondSpeaking ? mouthAt(line, lineElapsed) : 0
      });
      return sourceCanvas;
    }
    window.FILM = FILM;
    window.LENGTH = LENGTH;
    window.draw = draw;
    FilmPlayer.mount(FILM);
  </script>
</body>
</html>
