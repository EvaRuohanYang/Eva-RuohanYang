<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>

    <style>
        body {
            margin: 0;
            background: #12263a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        canvas {
            background: #12263a;
            display: block;
        }
    </style>
</head>

<body>

<canvas id="canvas" width="800" height="600"></canvas>

<script>
    // Window size
    const WIDE = 800;
    const HIGH = 600;

    // Snake settings
    const GAP = 14;
    const SPEED = 4;
    const TURN = 0.15;
    const NEAR = 30;

    // Maximum bend between body joints
    const BEND = Math.PI / 8;

    // Quarter turn
    const QUARTER = Math.PI / 2;

    // Snake width from head to tail
    const WIDTHS = [
        18, 20, 17, 16, 16, 16, 16, 16,
        16, 16, 16, 15, 15, 15, 15,
        14, 14, 13, 13, 12, 12, 11,
        10, 9, 8, 7, 6, 5, 4
    ];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Mouse position
    let mouse = {
        x: WIDE / 2,
        y: HIGH / 2
    };

    // Snake points
    let points = [];
    let angles = [];

    // Start the snake as a straight line
    for (let i = 0; i < WIDTHS.length; i++) {
        points.push({
            x: WIDE / 2 - i * GAP,
            y: HIGH / 2
        });

        angles.push(0);
    }

    // Mouse movement
    canvas.addEventListener("mousemove", function(event) {
        const rect = canvas.getBoundingClientRect();

        mouse.x = event.clientX - rect.left;
        mouse.y = event.clientY - rect.top;
    });


    // Find the angle from one point to another
    function angleTo(start, end) {
        return Math.atan2(
            end.y - start.y,
            end.x - start.x
        );
    }


    // Walk a certain distance in a direction
    function walk(start, angle, distance) {
        return {
            x: start.x + Math.cos(angle) * distance,
            y: start.y + Math.sin(angle) * distance
        };
    }


    // Keep an angle within a certain turning limit
    function limit(angle, middle, most) {

        let away =
            (angle - middle + Math.PI) %
            (2 * Math.PI) - Math.PI;

        if (away > most) {
            return middle + most;
        }

        if (away < -most) {
            return middle - most;
        }

        return angle;
    }


    // Move the snake
    function moveSnake() {

        const head = points[0];

        // Distance from head to mouse
        const dx = head.x - mouse.x;
        const dy = head.y - mouse.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        // Stop when the snake is close enough
        if (distance < NEAR) {
            return;
        }

        // The head wants to face the mouse
        const wanted = angleTo(head, mouse);

        // But it can only turn a little bit each frame
        angles[0] = limit(
            wanted,
            angles[0],
            TURN
        );

        // Move the head
        points[0] = walk(
            head,
            angles[0],
            SPEED
        );


        // Move the rest of the body
        for (let i = 1; i < WIDTHS.length; i++) {

            // This point wants to face the point in front of it
            const wanted = angleTo(
                points[i],
                points[i - 1]
            );

            // Limit how much this joint can bend
            angles[i] = limit(
                wanted,
                angles[i - 1],
                BEND
            );

            // Keep the correct distance between body points
            points[i] = walk(
                points[i - 1],
                angles[i],
                -GAP
            );
        }
    }


    // Get the outline of the snake
    function getOutline() {

        let left = [];
        let right = [];

        for (let i = 0; i < WIDTHS.length; i++) {

            // One side
            left.push(
                walk(
                    points[i],
                    angles[i] - QUARTER,
                    WIDTHS[i]
                )
            );

            // Other side
            right.push(
                walk(
                    points[i],
                    angles[i] + QUARTER,
                    WIDTHS[i]
                )
            );
        }

        // Reverse the right side
        right.reverse();

        // Nose
        const nose = walk(
            points[0],
            angles[0],
            WIDTHS[0]
        );

        return [nose, ...left, ...right];
    }


    // Draw the snake
    function drawSnake() {

        ctx.clearRect(
            0,
            0,
            WIDE,
            HIGH
        );

        const outline = getOutline();

        if (outline.length === 0) {
            return;
        }


        // Start drawing the snake
        ctx.beginPath();

        ctx.moveTo(
            outline[0].x,
            outline[0].y
        );

        // Draw the outline
        for (let i = 1; i < outline.length; i++) {

            ctx.lineTo(
                outline[i].x,
                outline[i].y
            );
        }

        ctx.closePath();

        // Snake color
        ctx.fillStyle = "#ee6c4d";

        // White border
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;

        ctx.fill();
        ctx.stroke();


        // Draw the eyes
        const head = points[0];
        const facing = angles[0];

        drawCircle(
            walk(head, facing - 1.2, 9),
            3
        );

        drawCircle(
            walk(head, facing + 1.2, 9),
            3
        );
    }


    // Draw a circle
    function drawCircle(position, radius) {

        ctx.beginPath();

        ctx.arc(
            position.x,
            position.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "white";
        ctx.fill();
    }


    // Game loop
    function frame() {

        moveSnake();
        drawSnake();

        requestAnimationFrame(frame);
    }


    // Start the snake
    frame();

</script>

</body>
</html>
