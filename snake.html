<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
    body {
        margin: 0;
        background: #12263a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    canvas {
        background: #12263a;
        display: block;
    }
</style>
</head>

<body>

<canvas id="canvas" width="800" height="600"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const WIDE = 800;
const HIGH = 600;

const GAP = 14;

const PLAYER_SPEED = 4.5;
const PLAYER_TURN = 0.28;

const NEAR = 15;
const BEND = Math.PI / 5;
const QUARTER = Math.PI / 2;


// Your snake starts short
const PLAYER_START_LENGTH = 10;


// How many small snakes should normally be alive
const MAX_AI_SNAKES = 8;


// New snakes appear every few seconds
const SPAWN_TIME = 120;


const WIDTHS = [
    18, 20, 17, 16, 16, 16, 16, 16,
    16, 16, 16, 15, 15, 15, 15,
    14, 14, 13, 13, 12, 12, 11,
    10, 9, 8, 7, 6, 5, 4
];


let mouse = {
    x: WIDE / 2,
    y: HIGH / 2
};


canvas.addEventListener("mousemove", function(event) {

    const rect = canvas.getBoundingClientRect();

    mouse.x = event.clientX - rect.left;
    mouse.y = event.clientY - rect.top;

});


/* =========================
   ANGLE FUNCTIONS
========================= */

function angleTo(start, end) {

    return Math.atan2(
        end.y - start.y,
        end.x - start.x
    );

}


function walk(start, angle, distance) {

    return {
        x: start.x + Math.cos(angle) * distance,
        y: start.y + Math.sin(angle) * distance
    };

}


function limit(angle, middle, most) {

    let away =
        (angle - middle + Math.PI) %
        (2 * Math.PI) - Math.PI;

    if (away > most) {
        return middle + most;
    }

    if (away < -most) {
        return middle - most;
    }

    return angle;

}


/* =========================
   CREATE SNAKE
========================= */

function createSnake(
    x,
    y,
    length,
    color,
    isPlayer
) {

    let snake = {

        points: [],
        angles: [],

        color: color,

        isPlayer: isPlayer,

        alive: true,

        targetAngle:
            Math.random() * Math.PI * 2,

        changeTimer: 0

    };


    for (let i = 0; i < length; i++) {

        snake.points.push({
            x: x - i * GAP,
            y: y
        });

        snake.angles.push(0);

    }


    return snake;

}


/* =========================
   PLAYER
========================= */

let player = createSnake(
    WIDE / 2,
    HIGH / 2,
    PLAYER_START_LENGTH,
    "#ee6c4d",
    true
);


let snakes = [player];


/* =========================
   AI COLORS
========================= */

const AI_COLORS = [
    "#4cc9f0",
    "#90be6d",
    "#f72585",
    "#f9c74f",
    "#b388eb",
    "#43aa8b",
    "#ff9f1c",
    "#72efdd"
];


/* =========================
   FOOD
========================= */

let foods = [];

const FOOD_COUNT = 30;


function createFood(x, y) {

    return {
        x: x,
        y: y,
        radius: 5
    };

}


function addRandomFood() {

    foods.push(
        createFood(
            20 + Math.random() * (WIDE - 40),
            20 + Math.random() * (HIGH - 40)
        )
    );

}


for (let i = 0; i < FOOD_COUNT; i++) {
    addRandomFood();
}


/* =========================
   SPAWN TIMER
========================= */

let spawnTimer = 0;


/* =========================
   SPAWN NEW SMALL SNAKE
========================= */

function spawnNewSnake() {

    let x;
    let y;

    let tries = 0;


    /*
       Try to spawn away from
       the player's snake.
    */

    do {

        x =
            40 +
            Math.random() *
            (WIDE - 80);

        y =
            40 +
            Math.random() *
            (HIGH - 80);

        tries++;

    } while (
        Math.hypot(
            x - player.points[0].x,
            y - player.points[0].y
        ) < 150 &&
        tries < 30
    );


    /*
       NEW SNAKES ARE SMALL
       Only 5–8 body parts.
    */

    const length =
        5 +
        Math.floor(Math.random() * 4);


    const color =
        AI_COLORS[
            Math.floor(
                Math.random() *
                AI_COLORS.length
            )
        ];


    const newSnake =
        createSnake(
            x,
            y,
            length,
            color,
            false
        );


    newSnake.angles[0] =
        Math.random() *
        Math.PI * 2;


    newSnake.targetAngle =
        newSnake.angles[0];


    snakes.push(newSnake);

}


/* =========================
   COUNT LIVING AI SNAKES
========================= */

function countAliveAI() {

    let count = 0;

    for (let i = 1; i < snakes.length; i++) {

        if (snakes[i].alive) {
            count++;
        }

    }

    return count;

}


/* =========================
   KEEP SPAWNING SNAKES
========================= */

function maintainSnakes() {

    spawnTimer--;


    /*
       If there aren't enough snakes,
       create one immediately.
    */

    if (
        countAliveAI() < MAX_AI_SNAKES &&
        spawnTimer <= 0
    ) {

        spawnNewSnake();

        /*
           Don't spawn all of them at once.
        */

        spawnTimer = SPAWN_TIME;

    }

}


/* =========================
   MOVE PLAYER
========================= */

function movePlayer() {

    if (!player.alive) {
        return;
    }


    const head =
        player.points[0];


    const distance =
        Math.hypot(
            head.x - mouse.x,
            head.y - mouse.y
        );


    if (distance < NEAR) {
        return;
    }


    const wanted =
        angleTo(
            head,
            mouse
        );


    player.angles[0] =
        limit(
            wanted,
            player.angles[0],
            PLAYER_TURN
        );


    player.points[0] =
        walk(
            head,
            player.angles[0],
            PLAYER_SPEED
        );


    moveBody(player);

}


/* =========================
   MOVE BODY
========================= */

function moveBody(snake) {

    for (
        let i = 1;
        i < snake.points.length;
        i++
    ) {

        const wanted =
            angleTo(
                snake.points[i],
                snake.points[i - 1]
            );


        snake.angles[i] =
            limit(
                wanted,
                snake.angles[i - 1],
                BEND
            );


        snake.points[i] =
            walk(
                snake.points[i - 1],
                snake.angles[i],
                -GAP
            );

    }

}


/* =========================
   MOVE AI
========================= */

function moveAI(snake) {

    if (!snake.alive) {
        return;
    }


    const head =
        snake.points[0];


    snake.changeTimer--;


    if (snake.changeTimer <= 0) {

        snake.changeTimer =
            30 +
            Math.random() * 70;


        if (
            foods.length > 0 &&
            Math.random() < 0.7
        ) {

            let closest = null;
            let closestDistance =
                Infinity;


            for (const food of foods) {

                const distance =
                    Math.hypot(
                        food.x - head.x,
                        food.y - head.y
                    );


                if (
                    distance <
                    closestDistance
                ) {

                    closestDistance =
                        distance;

                    closest = food;

                }

            }


            if (closest) {

                snake.targetAngle =
                    angleTo(
                        head,
                        closest
                    );

            }

        } else {

            snake.targetAngle +=
                (Math.random() - 0.5) *
                1.5;

        }

    }


    /*
       Stay away from edges.
    */

    const margin = 60;


    if (head.x < margin) {
        snake.targetAngle = 0;
    }

    if (head.x > WIDE - margin) {
        snake.targetAngle = Math.PI;
    }

    if (head.y < margin) {
        snake.targetAngle =
            Math.PI / 2;
    }

    if (head.y > HIGH - margin) {
        snake.targetAngle =
            -Math.PI / 2;
    }


    snake.angles[0] =
        limit(
            snake.targetAngle,
            snake.angles[0],
            0.12
        );


    snake.points[0] =
        walk(
            head,
            snake.angles[0],
            2.4
        );


    moveBody(snake);

}


/* =========================
   FOOD COLLISION
========================= */

function checkFood(snake) {

    if (!snake.alive) {
        return;
    }


    const head =
        snake.points[0];


    for (
        let i = foods.length - 1;
        i >= 0;
        i--
    ) {

        const food =
            foods[i];


        const distance =
            Math.hypot(
                head.x - food.x,
                head.y - food.y
            );


        if (distance < 20) {

            const last =
                snake.points[
                    snake.points.length - 1
                ];


            /*
               Add one body segment.
            */

            snake.points.push({
                x: last.x,
                y: last.y
            });


            snake.angles.push(
                snake.angles[
                    snake.angles.length - 1
                ]
            );


            foods.splice(i, 1);


            addRandomFood();

        }

    }

}


/* =========================
   KILL SNAKE
========================= */

function killSnake(snake) {

    if (!snake.alive) {
        return;
    }


    snake.alive = false;


    /*
       Dead snake becomes food.
    */

    for (
        let i = 0;
        i < snake.points.length;
        i += 2
    ) {

        const point =
            snake.points[i];


        foods.push(
            createFood(
                point.x,
                point.y
            )
        );

    }

}


/* =========================
   PLAYER COLLISION
========================= */

function checkPlayerCollision() {

    if (!player.alive) {
        return;
    }


    const head =
        player.points[0];


    for (
        let s = 1;
        s < snakes.length;
        s++
    ) {

        const other =
            snakes[s];


        if (!other.alive) {
            continue;
        }


        for (
            let i = 1;
            i < other.points.length;
            i++
        ) {

            const body =
                other.points[i];


            const distance =
                Math.hypot(
                    head.x - body.x,
                    head.y - body.y
                );


            if (distance < 15) {

                player.alive = false;

                return;

            }

        }

    }

}


/* =========================
   AI COLLISIONS
========================= */

function checkAICollisions() {

    for (
        let s = 1;
        s < snakes.length;
        s++
    ) {

        const ai =
            snakes[s];


        if (!ai.alive) {
            continue;
        }


        const head =
            ai.points[0];


        /*
           AI hits player
        */

        for (
            let i = 1;
            i < player.points.length;
            i++
        ) {

            const body =
                player.points[i];


            const distance =
                Math.hypot(
                    head.x - body.x,
                    head.y - body.y
                );


            if (distance < 14) {

                killSnake(ai);

                break;

            }

        }


        if (!ai.alive) {
            continue;
        }


        /*
           AI can hit another AI
        */

        for (
            let otherIndex = 1;
            otherIndex < snakes.length;
            otherIndex++
        ) {

            if (otherIndex === s) {
                continue;
            }


            const other =
                snakes[otherIndex];


            if (!other.alive) {
                continue;
            }


            for (
                let i = 1;
                i < other.points.length;
                i++
            ) {

                const body =
                    other.points[i];


                const distance =
                    Math.hypot(
                        head.x - body.x,
                        head.y - body.y
                    );


                if (distance < 13) {

                    killSnake(ai);

                    break;

                }

            }


            if (!ai.alive) {
                break;
            }

        }

    }

}


/* =========================
   DRAW FOOD
========================= */

function drawFood() {

    for (const food of foods) {

        ctx.beginPath();

        ctx.arc(
            food.x,
            food.y,
            food.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#90ee90";

        ctx.fill();

    }

}


/* =========================
   DRAW SNAKE
========================= */

function drawSnake(snake) {

    if (!snake.alive) {
        return;
    }


    let left = [];
    let right = [];


    for (
        let i = 0;
        i < snake.points.length;
        i++
    ) {

        const width =
            WIDTHS[
                Math.min(
                    i,
                    WIDTHS.length - 1
                )
            ];


        left.push(
            walk(
                snake.points[i],
                snake.angles[i] -
                    QUARTER,
                width
            )
        );


        right.push(
            walk(
                snake.points[i],
                snake.angles[i] +
                    QUARTER,
                width
            )
        );

    }


    right.reverse();


    const nose =
        walk(
            snake.points[0],
            snake.angles[0],
            WIDTHS[0]
        );


    const outline =
        [nose, ...left, ...right];


    ctx.beginPath();


    ctx.moveTo(
        outline[0].x,
        outline[0].y
    );


    for (
        let i = 1;
        i < outline.length;
        i++
    ) {

        ctx.lineTo(
            outline[i].x,
            outline[i].y
        );

    }


    ctx.closePath();


    ctx.fillStyle =
        snake.color;

    ctx.strokeStyle =
        "white";

    ctx.lineWidth =
        snake.isPlayer ? 3 : 2;


    ctx.fill();
    ctx.stroke();


    /*
       Player eyes
    */

    if (snake.isPlayer) {

        const head =
            snake.points[0];

        const facing =
            snake.angles[0];


        drawEye(
            walk(
                head,
                facing - 1.2,
                9
            )
        );


        drawEye(
            walk(
                head,
                facing + 1.2,
                9
            )
        );

    }

}


/* =========================
   DRAW EYES
========================= */

function drawEye(position) {

    ctx.beginPath();

    ctx.arc(
        position.x,
        position.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();

}


/* =========================
   GAME OVER
========================= */

function drawGameOver() {

    if (player.alive) {
        return;
    }


    ctx.fillStyle =
        "rgba(0,0,0,0.5)";


    ctx.fillRect(
        0,
        0,
        WIDE,
        HIGH
    );


    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 48px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        "GAME OVER",
        WIDE / 2,
        HIGH / 2
    );


    ctx.font =
        "20px Arial";


    ctx.fillText(
        "Refresh the page to play again",
        WIDE / 2,
        HIGH / 2 + 45
    );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        WIDE,
        HIGH
    );


    movePlayer();


    for (
        let i = 1;
        i < snakes.length;
        i++
    ) {

        moveAI(
            snakes[i]
        );

    }


    /*
       Continuously create
       new small snakes.
    */

    maintainSnakes();


    checkFood(player);


    for (
        let i = 1;
        i < snakes.length;
        i++
    ) {

        checkFood(
            snakes[i]
        );

    }


    checkPlayerCollision();

    checkAICollisions();


    drawFood();


    for (const snake of snakes) {

        drawSnake(snake);

    }


    drawGameOver();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
