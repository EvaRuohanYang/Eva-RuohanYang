<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Snake</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #12263a;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;
}

resize();

window.addEventListener("resize", resize);


/* =========================
   SNAKE
========================= */

const snake = [];

const length = 20;
const gap = 12;

let angle = 0;

let targetX = width / 2 + 200;
let targetY = height / 2;


/* Start the snake */

for (let i = 0; i < length; i++) {

    snake.push({
        x: width / 2 - i * gap,
        y: height / 2
    });
}


/* =========================
   CONTROL
========================= */

function moveTarget(x, y) {

    targetX = x;
    targetY = y;
}


/* Mouse */

canvas.addEventListener("mousemove", function(e) {

    moveTarget(
        e.clientX,
        e.clientY
    );

});


/* Touch */

canvas.addEventListener("touchstart", function(e) {

    e.preventDefault();

    const touch = e.touches[0];

    moveTarget(
        touch.clientX,
        touch.clientY
    );

}, { passive: false });


canvas.addEventListener("touchmove", function(e) {

    e.preventDefault();

    const touch = e.touches[0];

    moveTarget(
        touch.clientX,
        touch.clientY
    );

}, { passive: false });


/* =========================
   ANGLE
========================= */

function normalizeAngle(a) {

    while (a > Math.PI) {
        a -= Math.PI * 2;
    }

    while (a < -Math.PI) {
        a += Math.PI * 2;
    }

    return a;
}


/* =========================
   UPDATE
========================= */

function update() {

    const head = snake[0];

    const wantedAngle = Math.atan2(
        targetY - head.y,
        targetX - head.x
    );


    /*
       Smooth turning.
       This is deliberately simple.
    */

    let difference =
        normalizeAngle(
            wantedAngle - angle
        );


    const turnSpeed = 0.12;


    if (difference > turnSpeed) {
        difference = turnSpeed;
    }

    if (difference < -turnSpeed) {
        difference = -turnSpeed;
    }


    angle += difference;


    /*
       Move head.
    */

    const speed = 4;


    head.x += Math.cos(angle) * speed;
    head.y += Math.sin(angle) * speed;


    /*
       Make the rest of the body
       follow the previous point.
    */

    for (let i = 1; i < snake.length; i++) {

        const front = snake[i - 1];
        const current = snake[i];


        const dx = front.x - current.x;
        const dy = front.y - current.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);


        if (distance > gap) {

            current.x =
                front.x -
                (dx / distance) * gap;

            current.y =
                front.y -
                (dy / distance) * gap;
        }
    }
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.fillStyle = "#12263a";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
       Body
    */

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        const part = snake[i];

        const radius =
            Math.max(
                5,
                14 - i * 0.3
            );


        ctx.beginPath();

        ctx.arc(
            part.x,
            part.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#4ade80";

        ctx.fill();
    }


    /*
       Head
    */

    const head = snake[0];

    const headRadius = 17;


    ctx.beginPath();

    ctx.arc(
        head.x,
        head.y,
        headRadius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#4ade80";

    ctx.fill();


    /*
       Eyes
    */

    const eyeDistance = 8;


    const eye1X =
        head.x +
        Math.cos(angle - 0.65) *
        eyeDistance;

    const eye1Y =
        head.y +
        Math.sin(angle - 0.65) *
        eyeDistance;


    const eye2X =
        head.x +
        Math.cos(angle + 0.65) *
        eyeDistance;

    const eye2Y =
        head.y +
        Math.sin(angle + 0.65) *
        eyeDistance;


    ctx.fillStyle = "white";


    ctx.beginPath();

    ctx.arc(
        eye1X,
        eye1Y,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2X,
        eye2Y,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Pupils
    */

    ctx.fillStyle = "#12263a";


    ctx.beginPath();

    ctx.arc(
        eye1X + Math.cos(angle) * 1.5,
        eye1Y + Math.sin(angle) * 1.5,
        1.8,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2X + Math.cos(angle) * 1.5,
        eye2Y + Math.sin(angle) * 1.5,
        1.8,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


gameLoop();

</script>

</body>
</html>
